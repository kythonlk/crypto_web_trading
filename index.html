<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crypto Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{
        overflow-x: hidden;
    }
    .widget-container {
      margin: 20px;
    }
  </style>
</head>
<body>
<div class="row p-4">
    <div class="d-flex justify-content-center">
        <h1>Trade Crypto with Our bot and earn tons of money</h1>
    </div>
</div>
<div class="widget-container">
  <div class="tradingview-widget-container p-4">
    <div class="d-flex justify-content-center">
    <div class="tradingview-widget-container__widget"></div>
    <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-mini-symbol-overview.js" async>
    {
      "symbol": "BINANCE:BTCUSDT",
      "width": 1000,
      "height": 400,
      "locale": "en",
      "dateRange": "1M",
      "colorTheme": "dark",
      "trendLineColor": "rgba(41, 98, 255, 1)",
      "underLineColor": "rgba(41, 98, 255, 0.3)",
      "underLineBottomColor": "rgba(41, 98, 255, 0)",
      "isTransparent": false,
      "autosize": true,
      "largeChartUrl": ""
    }
    </script>
  </div>
</div>

<div class="container mt-5">
    <h2>Trade Amount Table</h2>
    <table class="table table-bordered p-4">
      <thead>
        <tr>
          <th class="col-md-4 text-center">Enter amount You want to trade</th>
          <th class="col-md-8 text-center">After Trade with our bot</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="text-center">
            <div class="input-group">
                <input type="number" step="0.01" class="form-control" id="tradeAmount" placeholder="Amount" oninput="calculateOutput()" />
                <span class="input-group-text">$</span>
              </div>
          </td>
          <td  class="text-center"><span id="outputValue">0.00</span> $</td>
        </tr>
      </tbody>
    </table>
  </div>
  

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="./cal.js" async></script>
</body>
</html>
